<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Test Town v2 viewport QA</title><style>body{margin:0;background:#222;color:#fff;font:14px sans-serif}nav{position:sticky;top:0;z-index:2;padding:8px;background:#111}button{margin:3px}.stage{transform-origin:top left}.shell{margin:12px;border:2px solid #8fd06d}iframe{display:block;border:0;width:100%;height:100%}#metrics{position:fixed;z-index:3;right:8px;bottom:8px;width:min(520px,90vw);max-height:45vh;overflow:auto;margin:0;padding:10px;background:#000e;color:#bff;border:1px solid #8fd06d;white-space:pre-wrap}</style></head><body><nav id="sizes"></nav><div class="stage"><div class="shell"><iframe title="Test Town v2 QA"></iframe></div></div><pre id="metrics" aria-live="polite"></pre><script>
const sizes=[[1920,1080],[1366,768],[1280,720],[1024,768],[390,844],[844,390],[412,915],[915,412]],nav=document.querySelector('#sizes'),shell=document.querySelector('.shell'),stage=document.querySelector('.stage'),frame=document.querySelector('iframe'),metrics=document.querySelector('#metrics');let desired={width:960,height:540,touch:false},loadedTouch=null;
const rect=node=>{if(!node)return null;const r=node.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
function measure(){let child={status:'loading'};try{const w=frame.contentWindow,d=frame.contentDocument,canvas=d?.querySelector('#town'),touch=d?.querySelector('.touch');child={status:d?.readyState,innerWidth:w?.innerWidth,innerHeight:w?.innerHeight,devicePixelRatio:w?.devicePixelRatio,canvas:{intrinsicWidth:canvas?.width,intrinsicHeight:canvas?.height,rect:rect(canvas)},document:{scrollWidth:d?.documentElement.scrollWidth,scrollHeight:d?.documentElement.scrollHeight,clientWidth:d?.documentElement.clientWidth,clientHeight:d?.documentElement.clientHeight},touch:{hidden:touch?getComputedStyle(touch).display==='none':null,rect:rect(touch)},qa:d?.documentElement.dataset.testTownQa?JSON.parse(d.documentElement.dataset.testTownQa):null}}catch(error){child={status:'error',error:String(error)}}metrics.textContent=JSON.stringify({desired,iframe:rect(frame),child},null,2)}
function show(width,height){const touch=width<=915;desired={width,height,touch};shell.style.width=width+'px';shell.style.height=height+'px';stage.style.transform=`scale(${Math.min(1,(innerWidth-24)/width)})`;if(loadedTouch!==touch){loadedTouch=touch;frame.src=`./test-town-v2.html?qa=1${touch?'&touch=1':''}`}else requestAnimationFrame(measure)}
for(const [w,h] of sizes){const b=document.createElement('button');b.textContent=`${w}×${h}`;b.onclick=()=>show(w,h);nav.append(b)}frame.addEventListener('load',measure);addEventListener('resize',()=>{show(desired.width,desired.height);measure()});setInterval(measure,500);show(960,540);
</script></body></html>
