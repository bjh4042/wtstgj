<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S7·S8 이동 검수</title><style>
*{box-sizing:border-box}body{margin:0;background:#152b31;color:#edf7f3;font:16px system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:12px}h1{font-size:20px;margin:4px 0 8px}.notice{background:#34514b;border-radius:8px;padding:10px;margin-bottom:10px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}button,select{font:inherit;padding:9px 14px;border:1px solid #a7c8b8;border-radius:8px;background:#e5f3e8;color:#173a2c;min-height:44px}button:disabled{opacity:.5}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0c2025;outline:2px solid #41665d;border-radius:6px}.controls{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:12px}.controls button{touch-action:none;user-select:none}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}#status{min-height:24px;margin:10px 0}small{display:block;margin-top:8px;color:#c2d8cb}
</style></head><body><main><h1>S7·S8 원화 맵 이동 검수</h1><div class="notice">이동 시뮬레이션입니다. 게임 저장·전투·조우·스토리와 연결되지 않으며, 맵 선택은 실제 게임의 워프가 아닙니다. 남자 캐릭터 원본으로 통행·구도만 확인합니다.</div><div class="toolbar"><label for="map">맵 </label><select id="map"><option>S7</option><option>S8</option></select><button id="reload">맵 다시 준비</button><button id="reset" disabled>시작 위치로</button><span>이동: WASD / 방향키 · 기존 검수 속도 192px/s</span></div><canvas id="view" tabindex="0" width="1280" height="720" aria-label="맵 이동 검수 화면"></canvas><p id="status" role="status" aria-live="polite">개발 실행 환경 확인 중…</p><div class="controls" aria-label="이동 버튼"><button class="up" data-dir="up" aria-label="위로 이동">↑</button><button class="left" data-dir="left" aria-label="왼쪽으로 이동">←</button><button class="down" data-dir="down" aria-label="아래로 이동">↓</button><button class="right" data-dir="right" aria-label="오른쪽으로 이동">→</button></div><small>1280×720 논리 화면. 발 접촉 범위 30×8 및 원본 통행 마스크를 유지합니다. 탭을 숨기면 이동을 멈춥니다.</small></main><script type="module" src="./native-walk/entry.mjs"></script></body></html>
