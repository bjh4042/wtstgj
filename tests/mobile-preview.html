<!doctype html><html lang="ko"><meta charset="utf-8"><title>거제 모바일 레이아웃 검증</title><style>body{margin:12px;background:#777;color:white;font:16px system-ui}button{padding:10px;margin:4px}iframe{display:block;border:0;background:#182a36;margin-top:12px}</style><h1>모바일 크기 검증용 화면</h1><p>Chrome 안의 반응형 화면 검사입니다. 실제 iOS 터치·키보드 검사를 대신하지 않습니다.</p><nav><button data-size="320,568">작은 폰 320×568</button><button data-size="390,844">폰 390×844</button><button data-size="844,390">가로 폰 844×390</button><button data-size="820,1180">태블릿 820×1180</button></nav><iframe id="mobile-game" title="거제 게임 모바일 화면" src="/" width="390" height="844"></iframe><script>document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h});</script></html>
