<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>VERTICAL SLICE viewport QA</title>
<style>
body{margin:12px;background:#273e4b;color:#fff;font:14px system-ui}h1{margin:0 0 4px;font-size:20px}p{margin:4px 0 10px}
nav{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:0;z-index:2;background:#273e4b;padding:5px 0}button{padding:7px}
#status{white-space:pre-wrap;background:#132631;padding:8px;margin:8px 0}iframe{display:block;border:2px solid #fff;background:#102b46;transform-origin:top left}
</style>
<h1>VERTICAL SLICE viewport QA</h1>
<p>실제 게임을 지정한 CSS viewport 안에서 실행합니다. 실제 기기·UA 검사를 대신하지 않습니다.</p>
<nav>
 <button data-size="1920,1080">PC 1920×1080</button><button data-size="1366,768">PC 1366×768</button>
 <button data-size="1280,720">PC 1280×720</button><button data-size="1024,768">PC 1024×768</button>
 <button data-size="390,844,touch">iPhone 세로 390×844</button><button data-size="844,390,touch">iPhone 가로 844×390</button>
 <button data-size="412,915,touch">Android 세로 412×915</button><button data-size="915,412,touch">Android 가로 915×412</button>
</nav>
<div id="status" role="status">프레임을 불러오는 중…</div>
<iframe id="game" title="실제 거제 게임 QA 프레임" src="/?slice-qa=1" width="1280" height="720"></iframe>
<script>
const frame=document.querySelector('#game'),status=document.querySelector('#status');
let expected={w:1280,h:720,touch:false};
function inspect(){
 try{const d=frame.contentDocument,w=frame.contentWindow,canvas=d.querySelector('#world'),world=d.querySelector('.world-frame'),touch=d.querySelector('.touch-controls'),battle=d.querySelector('.battle-window');
  d.body.classList.toggle('qa-touch',expected.touch);
  const cr=canvas?.getBoundingClientRect(),wr=world?.getBoundingClientRect(),br=battle?.getBoundingClientRect();
  status.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],scroll:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],world:wr&&[Math.round(wr.width),Math.round(wr.height)],canvas:cr&&[Math.round(cr.width),Math.round(cr.height)],ratio:cr&&+(cr.width/cr.height).toFixed(4),touchVisible:touch&&getComputedStyle(touch).display!=='none',battle:br&&[Math.round(br.width),Math.round(br.height)],slice:{position:canvas?.dataset.slicePosition,facing:canvas?.dataset.sliceFacing,scene:canvas?.dataset.sliceScene,queued:canvas?.dataset.sliceQueue},errors:{page:+d.documentElement.dataset.qaPageErrors||0,uncaught:+d.documentElement.dataset.qaUncaught||0,unhandled:+d.documentElement.dataset.qaUnhandled||0,last:d.documentElement.dataset.qaLast||''}},null,2);
 }catch(error){status.textContent=error.message}
}
frame.onload=()=>{inspect();setInterval(inspect,1000)};
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{const [w,h,mode]=button.dataset.size.split(',');expected={w:+w,h:+h,touch:mode==='touch'};frame.width=w;frame.height=h;frame.style.transform='none';inspect()});
</script></html>
