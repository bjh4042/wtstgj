<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../dist/style.css"><style>body{background:#08213b;color:white;padding:12px}.qa{max-width:900px;margin:auto}.battle-field{width:100%;position:relative}.battle-mon{display:block;background:#70a7a0;border:4px solid #17384b;border-radius:45% 55% 42% 58%}.battle-mon.enemy{background:#d67f8e}.battle-mon.ally{background:#66a1c9}.qa-controls{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.qa-controls button{min-height:38px;padding:6px;font-size:12px}#status{font-weight:800}</style></head><body><main class="qa"><p id="status">실제 렌더러 준비됨</p><div class="battle-field"><div class="combat-card enemy">상대 효과 대상</div><span class="battle-mon enemy"></span><span class="battle-mon ally"></span><div class="combat-card ally">아군 효과 대상</div></div><div class="qa-controls"><button id="all">19종 × 양방향 실행</button></div></main><script type="module">import{MOVE_EFFECTS,playMoveEffect}from'../dist/attack-effects.mjs';const field=document.querySelector('.battle-field'),ally=document.querySelector('.ally.battle-mon'),enemy=document.querySelector('.enemy.battle-mon'),status=document.querySelector('#status'),controls=document.querySelector('.qa-controls');async function run(key,side='ally'){status.textContent=key+' · '+side;await playMoveEffect({field,actor:side==='ally'?ally:enemy,target:side==='ally'?enemy:ally,key,volume:0})}for(const key of Object.keys(MOVE_EFFECTS)){const b=document.createElement('button');b.textContent=key;b.dataset.key=key;b.onclick=()=>run(key);controls.append(b)}document.querySelector('#all').onclick=async()=>{let n=0;for(const key of Object.keys(MOVE_EFFECTS))for(const side of['ally','enemy']){await run(key,side);status.textContent=++n+'/38 · '+key+' · '+side}status.textContent='완료 38/38 · 효과 레이어 '+document.querySelectorAll('.attack-effect-layer').length+'개'};</script></body></html>
