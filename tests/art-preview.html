<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../dist/style.css?v=7"><title>Step 1 art renderer QA</title><style>
body{margin:0;padding:18px;background:#102b3b;color:#f8f2d7}.qa{max-width:900px;margin:auto}.trainer-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:#f5eed4;color:#263c46;border:4px solid #294e5c;padding:12px}.panel canvas{display:block;width:100%;max-width:330px;margin:auto;background:#9fc58f;image-rendering:pixelated}.backs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.back-box{position:relative;aspect-ratio:9/8;background:#83c8d1;border:3px solid #f1dc93;overflow:hidden}.back-box .battle-mon{inset:0!important;width:100%!important;height:100%!important;animation:none}.back-box p{position:absolute;inset:auto 4px 4px;z-index:4;margin:0;background:#fffbdc;color:#213d4a;text-align:center}.qa-note{line-height:1.6}@media(max-width:620px){.trainer-gallery{grid-template-columns:1fr}.backs{grid-template-columns:1fr}.back-box{max-width:290px;margin:auto;width:100%}}
</style></head><body><main class="qa"><h1>Step 1 실제 렌더러</h1><p class="qa-note">트레이너: 아래·위·왼쪽·오른쪽 행 × idle·step1·step2 열. 전투: 아군 9:8 wrapper 안의 승인된 source crop.</p><section class="trainer-gallery" id="trainers"></section><h2>스타팅 아군 뒷모습</h2><section class="backs" id="backs"></section></main><script type="module">
import{TRAINER_DIRECTIONS,TRAINER_SHEETS,drawTrainer}from'../dist/trainer-sprites.mjs';import{battleBackMarkup}from'../dist/battle-sprites.mjs';
const trainers=document.querySelector('#trainers');for(const gender of['boy','girl']){const panel=document.createElement('section');panel.className='panel';panel.innerHTML=`<h2>${gender}</h2><canvas width="330" height="380"></canvas>`;trainers.append(panel);const canvas=panel.querySelector('canvas'),ctx=canvas.getContext('2d'),image=new Image();image.src='../dist/'+TRAINER_SHEETS[gender].src;await image.decode();ctx.imageSmoothingEnabled=false;TRAINER_DIRECTIONS.forEach((f,row)=>[0,1,2].forEach((frame,col)=>drawTrainer(ctx,image,{gender,facing:f,frame,x:55+col*110,y:88+row*94,height:66})))}
const names={1:'동비',4:'망울치',7:'소롱'},backs=document.querySelector('#backs');for(const id of[1,4,7]){const box=document.createElement('div');box.className='back-box';box.innerHTML=battleBackMarkup(id,'ally')+`<p>${id} · ${names[id]}</p>`;backs.append(box)}
</script></body></html>
