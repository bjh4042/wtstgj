<!doctype html><html lang="ko"><meta charset="utf-8"><title>실제 시작 지역 검증</title>
<style>body{margin:8px;background:#273e4b;color:white;font:13px sans-serif}nav{display:flex;gap:4px;flex-wrap:wrap}button{padding:8px}iframe{display:block;border:0;margin-top:10px}pre{max-height:160px;overflow:auto}</style>
<nav><button data-size="1536,1024">1536×1024</button><button data-size="1920,1080">1920×1080</button><button data-size="1366,768">1366×768</button><button data-size="1280,720">1280×720</button><button data-size="1024,768">1024×768</button><button data-size="390,844">iPhone 세로</button><button data-size="844,390">iPhone 가로</button><button data-size="412,915">Android 세로</button><button data-size="915,412">Android 가로</button><button data-qa="live">환경 재생</button><button data-qa="0">프레임 0</button><button data-qa="1">프레임 1</button><button data-qa="2">프레임 2</button><button data-grass="0">풀 0</button><button data-grass="1">풀 1</button><button data-grass="2">풀 2</button><button data-grass="3">풀 3</button><button id="reset-field">검증 위치 초기화</button><button id="fresh-game">검증 새 게임</button><button data-core="npc">CORE NPC PATROL</button><button data-core="look">CORE LOOK AROUND</button><button data-core="wander">CORE WANDER</button><button data-core="fixed">CORE FACE FIXED</button><button data-core="trainer">CORE TRAINER</button><button data-core="blocked">CORE SIGHT BLOCK</button><button data-core="ledge">CORE LEDGE</button><button data-core="connection">CORE CONNECTION</button><button data-core="area">CORE AREA</button><button data-core="resume">CORE SAVE RELOAD</button></nav>
<pre id="status" role="status"></pre>
<section aria-label="최종 입력 검증"><label>검증 키 <select id="qa-key"><option>ArrowRight</option><option>ArrowLeft</option><option>ArrowDown</option><option>ArrowUp</option><option>w</option><option>a</option><option>s</option><option>d</option><option>z</option><option>Enter</option><option>x</option><option>Escape</option></select></label><button id="qa-hold">키 0.7초 누르기</button><button id="qa-burst">키 8회 빠른 입력</button><button id="qa-reload">현재 게임 새로고침</button><button id="qa-save-view">검증 저장 상태 읽기</button><pre id="qa-input-result" aria-label="입력 검증 결과"></pre></section>
<button id="export-render">실제 캔버스 PNG 저장</button>
<iframe id="game" title="실제 게임 시작 지역" src="/" width="390" height="844"></iframe>
<script>
document.querySelectorAll('[data-core]').forEach(b=>b.onclick=()=>{const k=b.dataset.core;document.querySelector('#game').src='/?coreqa=1&scenario='+(k==='resume'?'trainer':k)+(k==='look'?'&movement=LOOK_AROUND':k==='wander'?'&movement=WANDER':k==='fixed'?'&movement=FACE_FIXED':k==='resume'?'&resume=1':'')});
const f=document.querySelector('#game'),status=document.querySelector('#status');
const inputResult=document.querySelector('#qa-input-result');
function sample(){const d=f.contentDocument,c=d?.querySelector('#world');return c?{position:c.dataset.fieldPosition,scene:c.dataset.fieldScene,facing:c.dataset.fieldFacing,menu:c.dataset.fieldMenu,dialogue:c.dataset.fieldDialogue,walk:c.dataset.walkFrame,core:JSON.parse(c.dataset.fieldCore||'{}'),animation:JSON.parse(c.dataset.fieldAnimation||'{}'),battle:!d.querySelector('#battle').hidden,errors:{...d.documentElement.dataset}}:null}
async function keyboardProbe(hold){
 inputResult.textContent='검증 중';
 const key=document.querySelector('#qa-key').value,code=key.length===1?'Key'+key.toUpperCase():key,w=f.contentWindow,events=[],before=sample();
 const emit=(type,repeat=false)=>f.contentDocument.querySelector('#world').dispatchEvent(new w.KeyboardEvent(type,{key,code,repeat,bubbles:true,cancelable:true}));
 const timer=setInterval(()=>{const s=sample();if(s)events.push(s)},25);
 if(hold){emit('keydown');for(let i=0;i<7;i++){await new Promise(r=>setTimeout(r,100));emit('keydown',true)}emit('keyup')}
 else for(let i=0;i<8;i++){emit('keydown');emit('keyup');await new Promise(r=>setTimeout(r,25))}
 await new Promise(r=>setTimeout(r,1200));clearInterval(timer);
 inputResult.textContent=JSON.stringify({method:hold?'synthetic keyboard held 700ms with repeats':'synthetic keyboard 8 rapid taps',key,before,after:sample(),observed:{walk:[...new Set(events.map(e=>e.walk))],phases:[...new Set(events.map(e=>e.core.sequence?.phase||e.core.mode))],effects:[...new Set(events.flatMap(e=>e.animation.effects.map(fx=>fx.kind)))],positions:[...new Set(events.map(e=>e.position))],battleFrames:events.filter(e=>e.battle).length,errors:events.filter(e=>Object.entries(e.errors).some(([k,v])=>k!=='qaLast'&&v!=='0'))}},null,2);
}
document.querySelector('#qa-hold').onclick=()=>keyboardProbe(true);
document.querySelector('#qa-burst').onclick=()=>keyboardProbe(false);
document.querySelector('#qa-reload').onclick=()=>f.contentWindow.location.reload();
document.querySelector('#qa-save-view').onclick=()=>{const keys=['geoje.monsters.field-core.qa.v1','geoje.monsters.golden-field.v1'],saved=JSON.parse(localStorage.getItem('geoje.monsters.save.v2')||'null');const progress=saved&&Object.fromEntries(Object.entries(saved).filter(([key])=>!['saveCode','updatedAt','revision','playSeconds'].includes(key)));inputResult.textContent=JSON.stringify({...Object.fromEntries(keys.map(k=>[k,JSON.parse(localStorage.getItem(k)||'null')])),progress},null,2)};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');f.width=w;f.height=h;requestAnimationFrame(()=>requestAnimationFrame(inspect))});
document.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{f.src=b.dataset.qa==='live'?'/':'/?qa=1&frame='+b.dataset.qa});
document.querySelectorAll('[data-grass]').forEach(b=>b.onclick=()=>{f.src='/?qa=1&pose=grass&grass='+b.dataset.grass});
function reset(fresh){f.onload=()=>{f.onload=null;localStorage.removeItem('geoje.monsters.golden-field.v1');if(fresh){localStorage.setItem('geoje.qa.previous-save',localStorage.getItem('geoje.monsters.save.v2')||'');localStorage.removeItem('geoje.monsters.save.v2')}f.src='/'};f.src='about:blank'}
document.querySelector('#reset-field').onclick=()=>reset(false);
document.querySelector('#fresh-game').onclick=()=>reset(true);
document.querySelector('#export-render').onclick=()=>{const c=f.contentDocument.querySelector('#world'),label=c.dataset.fieldDialogue?'dialogue':c.dataset.fieldMenu!=='closed'?'menu':c.dataset.fieldScene;c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='core2-'+label+'-'+JSON.parse(c.dataset.fieldAnimation||'{}').water+'-'+Date.now()+'.png';a.textContent='실제 렌더 PNG 내려받기';document.body.insertBefore(a,f);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)},'image/png')};
function inspect(){try{const d=f.contentDocument,c=d.querySelector('#world'),w=f.contentWindow,touch=d.querySelector('.touch-controls'),r=c.getBoundingClientRect();const targets=[...d.querySelectorAll('.touch-controls button')].map(b=>{const t=b.getBoundingClientRect();return {name:b.getAttribute('aria-label')||b.textContent.trim(),x:t.x,y:t.y,width:t.width,height:t.height,overlap:t.width>0&&t.height>0&&t.left<r.right&&t.right>r.left&&t.top<r.bottom&&t.bottom>r.top}}).filter(t=>t.width&&t.height);status.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],document:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],canvas:[r.width,r.height],native:[c.width,c.height],controllerTargets:targets,touch:w.getComputedStyle(touch).display,field:{...c.dataset},errors:{...d.documentElement.dataset}},null,2)}catch{}}
setInterval(inspect,400);
</script>
