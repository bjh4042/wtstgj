<!doctype html><html lang="ko"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에셋 독립 파이프라인 검증</title>
<style>body{background:#132b3d;color:#e6f1f7;font:16px system-ui;margin:24px}button,a{padding:10px;color:inherit}canvas{max-width:100%;height:auto;image-rendering:pixelated;border:1px solid #7592a5}.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0}#species{display:flex;gap:14px}#species>span{width:80px}.pass{color:#8bd6a9}pre{white-space:pre-wrap}@media(max-width:700px){.matrix{grid-template-columns:repeat(2,1fr)}}</style>
<h1>ART-INDEPENDENT GAME PIPELINE v1</h1><p>실제 필드 렌더 · PNG 로딩 · 환경 효과 검증</p>
<p><a href="/__pipeline-qa">기존 아트</a><a href="/__pipeline-qa?placeholder=1">전체 placeholder</a></p><pre id="report">검사 중…</pre>
<div id="species"></div><canvas id="field" width="1536" height="1024"></canvas><h2>시간 4종 × 날씨 4종</h2><div class="matrix"></div>
<script type="module">
import {configureAssets,loadAsset,resolveAsset,assetStats,assetMarkup,installAssetDOM} from '/asset-runtime.mjs';
import {createGoldenField,loadGoldenAssets,drawGoldenField,drawGoldenText,fieldAnimation,configureGoldenQA,drawHumanAsset} from '/golden-field.mjs';
import {TIME_STATES,WEATHER_STATES,geojeEnvironment} from '/environment-service.mjs';
const errors=[];addEventListener('error',e=>{errors.push(e.message);document.body.dataset.errors=String(errors.length)});addEventListener('unhandledrejection',e=>{errors.push(String(e.reason));document.body.dataset.errors=String(errors.length)});document.body.dataset.errors='0';
const placeholder=new URLSearchParams(location.search).has('placeholder');configureAssets({placeholder});
try{
 await loadGoldenAssets();const s=createGoldenField();configureGoldenQA(new URLSearchParams('qa=1&frame=0'));
 const canvas=document.querySelector('#field'),ctx=canvas.getContext('2d');drawGoldenField(ctx,s);drawGoldenText(ctx,1);
 const original=ctx.getImageData(0,0,1536,1024).data,checks=[];
 for(const time of TIME_STATES)for(const weather of WEATHER_STATES){geojeEnvironment.setMock({time,weather});drawGoldenField(ctx,s);drawGoldenText(ctx,1);const pixels=ctx.getImageData(0,0,1536,1024).data;let diff=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]!==original[i]||pixels[i+1]!==original[i+1]||pixels[i+2]!==original[i+2])diff++;checks.push({time,weather,diff,pass:(time==='DAY'&&weather==='CLEAR')?diff===0:diff>0});const figure=document.createElement('figure'),copy=document.createElement('canvas');copy.width=384;copy.height=256;copy.getContext('2d').drawImage(canvas,0,0,384,256);figure.append(copy);const caption=document.createElement('figcaption');caption.textContent=time+' / '+weather;figure.append(caption);document.querySelector('.matrix').append(figure)}
 geojeEnvironment.setMock({time:'DAY',weather:'CLEAR'});drawGoldenField(ctx,s);drawGoldenText(ctx,1);
 await Promise.all(['human.yeji.field','species.151.front','species.151.back','species.151.icon'].map(id=>loadAsset(id)));
 document.querySelector('#species').innerHTML=['front','back','icon'].map(slot=>assetMarkup('species.151.'+slot,'No.151 '+slot)).join('');installAssetDOM();
 const sample=await loadAsset('human.yeji.field');drawHumanAsset(ctx,'yeji',1000,550,'right',true,52);
 const report={pass:checks.every(c=>c.pass),placeholder,stats:assetStats(),environment:checks,contractSample:{id:sample.id,status:sample.status,width:sample.width,height:sample.height},errors};document.querySelector('#report').textContent=JSON.stringify(report,null,2);document.querySelector('#report').className=report.pass?'pass':'';document.body.dataset.ready='true';document.body.dataset.pass=String(report.pass);
}catch(e){document.querySelector('#report').textContent=e.stack;document.body.dataset.pass='false'}
</script></html>
