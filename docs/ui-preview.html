<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b46">
  <meta name="description" content="거제의 숲과 바다를 여행하는 오리지널 생태몬 수집 RPG.">
  <title>생태몬스터 UI 검수 · 별도 저장</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23102b46'/%3E%3Cpath d='M5 21 14 7l5 9 4-6 5 13H5z' fill='%238fd06d'/%3E%3C/svg%3E">
  <script>
  {
    const q={pageErrors:0,uncaught:0,unhandled:0,last:''},sync=()=>{for(const [k,v] of Object.entries(q))document.documentElement.dataset['qa'+k[0].toUpperCase()+k.slice(1)]=String(v)};
    addEventListener('error',event=>{q.pageErrors++;if(event.error||event.message)q.uncaught++;q.last=event.message||event.target?.src||'resource error';sync()},true);
    addEventListener('unhandledrejection',event=>{q.unhandled++;q.last=String(event.reason?.message||event.reason||'unhandled rejection');sync()});sync();
  }
  </script>
  <link rel="manifest" href="/wtstgj/pwa/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/wtstgj/pwa/icon-192.png">
  
  
  <script type="module" crossorigin src="/wtstgj/assets/ui-preview-D2C7S7vW.js"></script>
  <link rel="modulepreload" crossorigin href="/wtstgj/assets/preload-helper-AWl2jZ5X.js">
  <link rel="stylesheet" crossorigin href="/wtstgj/assets/ui-preview-WMU7-lXW.css">
</head>
<body>
  <main class="app-shell">
    <section class="world-frame" aria-label="거제 탐험 필드">
      <canvas id="world" width="1200" height="800" tabindex="0" aria-label="탐험 필드. 방향키 또는 WASD로 이동, Z나 Enter로 조사, X로 취소, M으로 메뉴"></canvas>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
    <div class="touch-controls" aria-label="터치 게임 조작">
      <div class="dpad">
        <button data-dir="up" aria-label="위로 이동">▲</button>
        <button data-dir="left" aria-label="왼쪽 이동">◀</button>
        <button data-dir="down" aria-label="아래로 이동">▼</button>
        <button data-dir="right" aria-label="오른쪽 이동">▶</button>
      </div>
      <button class="touch-menu" id="touch-menu">메뉴</button>
      <div class="action-pad">
        <button id="touch-b" aria-label="B 취소">B<small>취소</small></button>
        <button id="touch-a" aria-label="A 결정 또는 조사">A<small>결정</small></button>
      </div>
    </div>
    <button id="menu-button" class="desktop-menu" aria-label="메뉴 열기">메뉴 <kbd>Esc</kbd></button>
    <div class="play-key-guide"><span>이동 <kbd>방향키 / WASD</kbd> · 조사 <kbd>Z / Enter</kbd> · 메뉴 <kbd>M</kbd></span><button id="help-button">도움말 <kbd>H</kbd></button></div>
  </main>
  <dialog id="modal" aria-labelledby="modal-title">
    <div id="modal-content"></div>
    <div class="dialog-controls">
      <button id="dialog-prev" aria-label="이전 항목">◀</button>
      <button id="dialog-next" aria-label="다음 항목">▶</button>
      <button id="dialog-b">B 돌아가기</button>
      <button id="dialog-a">A 결정</button>
    </div>
  </dialog>
  <section id="battle" class="battle-overlay" hidden aria-label="생태몬 전투"></section>
  <section id="evolution" class="evolution-overlay" hidden aria-live="polite"></section>
  <dialog id="help-modal" aria-labelledby="help-title"></dialog>
</body>
</html>
